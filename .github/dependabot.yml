# This file controls the configuration for the "Dependabot" service, used to keep dependencies updated.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# See the above link for the reason why "directory" is set to "/"
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    open-pull-requests-limit: 10
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      actions:
        patterns: ['*']
  # npm. Lint-tool majors are grouped apart from routine minor/patch updates; fvtt-types bumps are ask-first (see CLAUDE.md).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # Lint/format/typing majors move together and are reviewed deliberately.
      lint-majors:
        patterns:
          [
            'eslint',
            '@eslint/*',
            '@eslint-community/*',
            'typescript-eslint',
            'typescript',
            'prettier',
            'globals',
          ]
        update-types: ['major']
      # Low-risk rollup of minor and patch dev-dependency updates.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
      # Any other major update arrives as its own PR.
    ignore:
      # fvtt-types bumps are migration-sized; update manually (see CLAUDE.md).
      - dependency-name: '@league-of-foundry-developers/fvtt-types'
