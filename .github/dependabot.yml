# This file controls the configuration for the "Dependabot" service, used to keep dependencies updated.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# See the above link for the reason why "directory" is set to "/"
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: 'github-actions'
    open-pull-requests-limit: 10
    directory: '/'
    schedule:
      interval: 'daily'
  # npm. Dev dependencies are grouped into one PR; fvtt-types bumps are ask-first (see CLAUDE.md).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      - dependency-name: '@league-of-foundry-developers/fvtt-types'
